<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Foodie</title>
    <!-- Separate Stylesheet -->
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>

    <!-- Toast Notification for Feedback -->
    <div id="toastNotification" class="toast-notification" role="status" aria-live="polite"></div>

    <div class="auth-wrapper">
        <!-- Brand Header -->
        <header class="brand-header">
            <a href="signup.html" class="brand-title" aria-label="Foodie Home">
                🍔 Foodie
            </a>
            <p class="brand-tagline">Delicious food, delivered to you.</p>
        </header>

        <!-- Main Card Container -->
        <main class="auth-card">
            <div class="card-header">
                <h1 class="card-title">Create Account</h1>
                <p class="card-subtitle">Sign up to explore top restaurants and order delicious food.</p>
            </div>

            <!--
                =======================================================
                BACKEND INTEGRATION POINT:
                - Action maps to your future Java Servlet (SignupServlet).
                - Method POST ensures secure data transmission.
                - Field 'name' attributes correspond to request.getParameter().
                =======================================================
            -->
            <form id="signupForm" action="SignupServlet" method="POST" novalidate>

                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-container">
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            class="form-control" 
                            placeholder="Enter your full name (min 3 characters)"
                            autocomplete="name"
                            required
                        >
                    </div>
                    <span class="error-message" id="fullNameError" role="alert"></span>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-container">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="name@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="error-message" id="emailError" role="alert"></span>
                </div>

                <!-- Phone Number Field with Indian +91 Badge -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="phone-group">
                        <span class="country-badge" aria-label="Indian country code">+91</span>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="form-control" 
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            autocomplete="tel"
                            required
                        >
                    </div>
                    <span class="error-message" id="phoneError" role="alert"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="At least 8 chars with A-Z, a-z, 0-9"
                            autocomplete="new-password"
                            required
                        >
                        <!-- Password Visibility Toggle Button -->
                        <button 
                            type="button" 
                            class="toggle-password" 
                            id="togglePassword" 
                            aria-label="Show password"
                        >👁</button>
                    </div>
                    <span class="error-message" id="passwordError" role="alert"></span>
                    <p class="password-hint">Must be at least 8 characters with 1 uppercase, 1 lowercase & 1 digit.</p>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-container">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            class="form-control" 
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >
                        <!-- Confirm Password Visibility Toggle Button -->
                        <button 
                            type="button" 
                            class="toggle-password" 
                            id="toggleConfirmPassword" 
                            aria-label="Show confirm password"
                        >👁</button>
                    </div>
                    <span class="error-message" id="confirmPasswordError" role="alert"></span>
                </div>

                <!-- Terms and Conditions Checkbox -->
                <div class="checkbox-group">
                    <label class="checkbox-label" for="terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>I agree to the <a href="#" class="terms-link">Terms & Conditions</a></span>
                    </label>
                    <span class="error-message" id="termsError" role="alert"></span>
                </div>

                <!-- Main Submit Button -->
                <button type="submit" class="btn btn-primary" id="signupSubmitBtn">
                    Create Account
                </button>

                <!-- Navigation link to Login -->
                <div class="auth-switch">
                    Already have an account? <a href="login.html">Login</a>
                </div>

                <!-- OR Divider -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- UI-Only Google Sign-In Button -->
                <button type="button" class="btn btn-google" id="googleSignUpBtn">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
            </form>
        </main>
    </div>

    <!-- Separate JavaScript File -->
    <script src="js/signup.js"></script>
</body>
</html>
